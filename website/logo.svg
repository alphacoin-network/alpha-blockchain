<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <!-- bitcoin-style flat orange coin -->
    <linearGradient id="coinface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffa733"/>
      <stop offset="55%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#e07f0e"/>
    </linearGradient>
    <!-- raised glyph shading -->
    <linearGradient id="glyphW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe6c4"/>
    </linearGradient>
    <filter id="embshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- coin circle -->
  <circle cx="140" cy="140" r="118" fill="url(#coinface)"/>
  <circle cx="140" cy="140" r="118" fill="none" stroke="#d97b0f" stroke-width="3" opacity="0.6"/>
  <!-- subtle inner light at top -->
  <ellipse cx="140" cy="92" rx="92" ry="38" fill="#ffffff" opacity="0.13"/>

  <!-- raised alpha glyph (3D "ubharta hua" effect): tilted like BTC's B -->
  <g transform="rotate(8 140 140)">
    <!-- deep embossed shadow (down-right) -->
    <text x="144" y="196" text-anchor="middle" font-family="Georgia, serif"
          font-size="152" font-weight="bold" font-style="italic"
          fill="#b35f08" filter="url(#embshadow)">&#945;</text>
    <text x="144" y="193" text-anchor="middle" font-family="Georgia, serif"
          font-size="152" font-weight="bold" font-style="italic"
          fill="#8a4a06" opacity="0.85">&#945;</text>
    <!-- top-left edge highlight (the "raise" light) -->
    <text x="136" y="187" text-anchor="middle" font-family="Georgia, serif"
          font-size="152" font-weight="bold" font-style="italic"
          fill="#ffd9a0" opacity="0.9">&#945;</text>
    <!-- main raised white glyph -->
    <text x="140" y="190" text-anchor="middle" font-family="Georgia, serif"
          font-size="152" font-weight="bold" font-style="italic"
          fill="url(#glyphW)">&#945;</text>
    <!-- faint glow under the glyph for depth -->
    <ellipse cx="140" cy="198" rx="52" ry="14" fill="#8a4a06" opacity="0.18"
             filter="url(#softglow)"/>
  </g>

  <!-- wordmark: alpha coin (bitcoin-style dark lowercase) -->
  <text x="300" y="182" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-3"
        fill="#4d4d4d">alpha coin</text>
  <!-- subtle underline shadow under wordmark -->
  <text x="300" y="183" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-3"
        fill="#3a3a3a" opacity="0.25" transform="translate(0 1)">alpha coin</text>
</svg>
