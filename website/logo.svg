<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <radialGradient id="face3d" cx="36%" cy="28%" r="85%">
      <stop offset="0%"   stop-color="#ffedbe"/>
      <stop offset="28%"  stop-color="#ffd468"/>
      <stop offset="58%"  stop-color="#f5a623"/>
      <stop offset="85%"  stop-color="#e07f0e"/>
      <stop offset="100%" stop-color="#b35f08"/>
    </radialGradient>
    <linearGradient id="rim3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fff3c8"/>
      <stop offset="30%"  stop-color="#ffcf5e"/>
      <stop offset="55%"  stop-color="#c47f12"/>
      <stop offset="80%"  stop-color="#f0b52f"/>
      <stop offset="100%" stop-color="#8a4a06"/>
    </linearGradient>
    <linearGradient id="edge3d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c47f12"/>
      <stop offset="45%"  stop-color="#7a4a08"/>
      <stop offset="100%" stop-color="#e0a62e"/>
    </linearGradient>
    <linearGradient id="glyphW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="glyphShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8a4a06"/>
      <stop offset="100%" stop-color="#5c3204"/>
    </linearGradient>
    <linearGradient id="shine3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#2e2e2e"/>
    </linearGradient>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="140" cy="252" rx="105" ry="18" fill="#000" opacity="0.28" filter="url(#b6)"/>

  <!-- coin thickness -->
  <circle cx="140" cy="150" r="120" fill="url(#edge3d)"/>
  <circle cx="140" cy="150" r="120" fill="none" stroke="#2a1a03"
          stroke-width="7" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- coin face -->
  <circle cx="140" cy="140" r="118" fill="url(#face3d)"/>
  <circle cx="140" cy="140" r="118" fill="none" stroke="url(#rim3d)" stroke-width="11"/>
  <circle cx="140" cy="140" r="112" fill="none" stroke="#fff3c8" stroke-width="1.5" opacity="0.8"/>
  <circle cx="140" cy="140" r="104" fill="none" stroke="#8a4a06" stroke-width="2" opacity="0.7"/>

  <!-- raised alpha glyph -->
  <g transform="rotate(8 140 140)">
    <text x="146" y="198" text-anchor="middle" font-family="Georgia, serif"
          font-size="150" font-weight="bold" font-style="italic"
          fill="url(#glyphShadow)" opacity="0.9" filter="url(#b3)">&#945;</text>
    <text x="145" y="196" text-anchor="middle" font-family="Georgia, serif"
          font-size="150" font-weight="bold" font-style="italic"
          fill="#6b3a05" opacity="0.7">&#945;</text>
    <text x="134" y="184" text-anchor="middle" font-family="Georgia, serif"
          font-size="150" font-weight="bold" font-style="italic"
          fill="#fff3d9" opacity="0.95">&#945;</text>
    <text x="140" y="190" text-anchor="middle" font-family="Georgia, serif"
          font-size="150" font-weight="bold" font-style="italic"
          fill="url(#glyphW)">&#945;</text>
  </g>
  <ellipse cx="96" cy="88" rx="80" ry="46" fill="url(#shine3d)"
           transform="rotate(-26 96 88)"/>

  <!-- wordmark -->
  <text x="300" y="182" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-3"
        fill="url(#wm)">alpha coin</text>
</svg>
