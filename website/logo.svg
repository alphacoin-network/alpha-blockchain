<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="face" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#f5c542"/>
      <stop offset="75%" stop-color="#c8912a"/>
      <stop offset="100%" stop-color="#8a5a14"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b53a"/>
      <stop offset="50%" stop-color="#9c6b1e"/>
      <stop offset="100%" stop-color="#5f3f0d"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5410"/>
      <stop offset="45%" stop-color="#3d2806"/>
      <stop offset="55%" stop-color="#8a5f16"/>
      <stop offset="100%" stop-color="#5f3f0d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- drop shadow -->
  <ellipse cx="200" cy="350" rx="130" ry="26" fill="#000" opacity="0.35" filter="url(#blur)"/>

  <!-- coin edge (3D depth) -->
  <ellipse cx="200" cy="216" rx="150" ry="150" fill="url(#edge)"/>
  <ellipse cx="200" cy="210" rx="150" ry="150" fill="url(#edge)" opacity="0.9"/>

  <!-- coin face -->
  <circle cx="200" cy="200" r="150" fill="url(#face)"/>

  <!-- milled rim -->
  <circle cx="200" cy="200" r="138" fill="none" stroke="#8a5a14" stroke-width="5" stroke-dasharray="6 7" opacity="0.8"/>
  <circle cx="200" cy="200" r="128" fill="none" stroke="#a3741f" stroke-width="2.5"/>

  <!-- alpha glyph with 3D emboss -->
  <text x="203" y="263" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="165" font-weight="bold" font-style="italic" fill="#f8d76b" opacity="0.55">&#945;</text>
  <text x="200" y="260" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="165" font-weight="bold" font-style="italic" fill="url(#glyph)">&#945;</text>

  <!-- top text -->
  <path id="topArc" d="M 200 78 A 122 122 0 0 1 322 200" fill="none"/>
  <path id="topArc2" d="M 78 200 A 122 122 0 0 1 200 78" fill="none"/>
  <text font-family="Verdana, sans-serif" font-size="26" font-weight="bold" letter-spacing="8" fill="#6b4a0f">
    <textPath href="#topArc2" startOffset="8%">ALPHA</textPath>
  </text>
  <text font-family="Verdana, sans-serif" font-size="26" font-weight="bold" letter-spacing="8" fill="#6b4a0f">
    <textPath href="#topArc" startOffset="6%">COIN</textPath>
  </text>

  <!-- specular shine -->
  <ellipse cx="150" cy="118" rx="95" ry="60" fill="url(#shine)" transform="rotate(-24 150 118)"/>
</svg>
