<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <radialGradient id="face" cx="38%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#fff9de"/>
      <stop offset="30%"  stop-color="#ffdf6e"/>
      <stop offset="65%"  stop-color="#f0b52f"/>
      <stop offset="100%" stop-color="#a06e13"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fff0a8"/>
      <stop offset="35%"  stop-color="#e8ae2e"/>
      <stop offset="60%"  stop-color="#8a5c10"/>
      <stop offset="85%"  stop-color="#d9a82e"/>
      <stop offset="100%" stop-color="#6b4a0f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#96660f"/>
      <stop offset="50%"  stop-color="#54390a"/>
      <stop offset="100%" stop-color="#b07f22"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7a5110"/>
      <stop offset="50%"  stop-color="#3a2605"/>
      <stop offset="100%" stop-color="#8a5c10"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="240" cy="420" rx="150" ry="24" fill="#000" opacity="0.35" filter="url(#blur6)"/>

  <!-- coin edge (thickness) -->
  <circle cx="240" cy="252" r="170" fill="url(#edge)"/>
  <circle cx="240" cy="252" r="170" fill="none" stroke="#2a1a03" stroke-width="8" stroke-dasharray="4 7" opacity="0.5"/>

  <!-- coin face -->
  <circle cx="240" cy="240" r="168" fill="url(#face)"/>

  <!-- rim -->
  <circle cx="240" cy="240" r="168" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <circle cx="240" cy="240" r="156" fill="none" stroke="#fff3bb" stroke-width="1.5" opacity="0.75"/>
  <circle cx="240" cy="240" r="146" fill="none" stroke="#8a5c10" stroke-width="2.5"/>

  <!-- embossed alpha glyph -->
  <text x="245" y="318" text-anchor="middle" font-family="Georgia, serif"
        font-size="215" font-weight="bold" font-style="italic"
        fill="#241503" opacity="0.5" filter="url(#blur2)">&#945;</text>
  <text x="236" y="310" text-anchor="middle" font-family="Georgia, serif"
        font-size="215" font-weight="bold" font-style="italic"
        fill="#ffedaa" opacity="0.85">&#945;</text>
  <text x="240" y="314" text-anchor="middle" font-family="Georgia, serif"
        font-size="215" font-weight="bold" font-style="italic"
        fill="url(#glyph)">&#945;</text>

  <!-- ALPHA text under the glyph (plain centered text, always renders) -->
  <text x="241" y="368" text-anchor="middle" font-family="Verdana, sans-serif"
        font-size="30" font-weight="bold" letter-spacing="10"
        fill="#2a1a03" opacity="0.45">ALPHA</text>
  <text x="240" y="366" text-anchor="middle" font-family="Verdana, sans-serif"
        font-size="30" font-weight="bold" letter-spacing="10"
        fill="#5f3f0d">ALPHA</text>

  <!-- specular shine -->
  <ellipse cx="166" cy="138" rx="112" ry="68" fill="url(#shine)"
           transform="rotate(-24 166 138)"/>
</svg>
