<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap — Alpha Blockchain</title>
  <meta name="description" content="Alpha Blockchain roadmap: completed milestones marked green, plus the path to the full Alpha ecosystem — DeFi, identity, RWA, Web3, AI and enterprise.">
  <meta name="theme-color" content="#f7931a">
  <link rel="icon" type="image/svg+xml" href="coin.svg">
  <link rel="apple-touch-icon" href="coin.svg"><link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .rm-section { margin-bottom: 40px; }
    .rm-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .rm-num { width: 46px; height: 46px; border-radius: 12px; background: linear-gradient(135deg,#ffd968,#e8a92e);
      color: #241a03; font-weight: 800; font-size: 20px; display:flex; align-items:center; justify-content:center; }
    .rm-head h3 { font-size: 22px; }
    .rm-head .prog { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--dim); }
    .milestone { display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px;
      border-left: 3px solid var(--border); margin-bottom: 10px; background: var(--card); border-radius: 0 10px 10px 0; }
    .milestone.done { border-left-color: var(--green); }
    .milestone.wip  { border-left-color: var(--gold); }
    .milestone.todo { border-left-color: var(--border); }
    .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
    .done .dot { background: rgba(61,220,151,.18); color: var(--green); }
    .wip  .dot { background: rgba(245,197,66,.18); color: var(--gold); }
    .todo .dot { background: var(--card2); color: var(--dim); }
    .milestone .mt { font-weight: 600; font-size: 15px; }
    .milestone .md { color: var(--dim); font-size: 13px; margin-top: 3px; }
    .milestone .tag-done { color: var(--green); font-size: 11px; font-weight: 700; margin-left: auto; }
    .milestone .tag-wip  { color: var(--gold);  font-size: 11px; font-weight: 700; margin-left: auto; }
    .milestone .tag-todo { color: var(--dim);   font-size: 11px; font-weight: 700; margin-left: auto; }
    .bar { height: 6px; border-radius: 4px; background: var(--card2); overflow: hidden; margin: 6px 0 18px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--gold)); }
  </style>
</head>
<body>
<nav></nav>
<section><div class="wrap">
  <h2 class="title">Roadmap</h2>
  <p class="sub">Step-by-step progress toward the full Alpha ecosystem —
     <b style="color:var(--green)">green = complete</b>,
     <b style="color:var(--gold)">gold = in progress</b>,
     <b style="color:var(--dim)">gray = planned</b>.</p>
  <div id="roadmap"></div>
</div></section>
<footer>Alpha Blockchain roadmap</footer>
<script src="app.js"></script>
<script>
nav('rm');
const M = (t, d, s) => ({ t, d, s }); // s: 'done' | 'wip' | 'todo'

const PHASES = [
  { name: 'Alpha Core — the foundation', items: [
    M('Alpha Blockchain core', 'Consensus, PoW, 21M supply, UTXO, reorgs, genesis', 'done'),
    M('Alpha Coin', 'Native asset — fees, rewards, miner incentive', 'done'),
    M('Alpha Script engine', 'P2PK/P2PKH/P2SH/multisig, CLTV/CSV timelocks', 'done'),
    M('SegWit v0 (BIP141-144)', 'P2WPKH/P2WSH, witness serialization, BIP143 sighash', 'done'),
    M('Taproot + Tapscript (BIP340/341/342)', 'Schnorr sigs, key+script-path spends, OP_CHECKSIGADD', 'done'),
    M('P2P network', 'Bitcoin wire protocol — version/inv/getdata/headers, relay, sync', 'done'),
    M('Mempool + RBF + package limits', 'Acceptance policy, ancestor/descendant rules, CPFP', 'done'),
    M('Alpha Explorer', 'Block explorer, search, live stats, token views', 'done'),
    M('Alpha RPC & API', '65+ bitcoind-style methods + REST + web API', 'done'),
    M('Alpha Wallet', 'Encryption, BIP32 HD, coin-select, signmessage, WIF', 'done'),
    M('Compact blocks + filters', 'BIP152/158/37 — fast relay + light-client support', 'done'),
    M('PSBT + descriptors', 'BIP174/380 — multi-party signing workflows', 'done'),
    M('Pruning + assumeutxo + Tor', 'Storage pruning, snapshot sync, .onion hosting', 'done'),
  ]},
  { name: 'Alpha Tokens & Assets', items: [
    M('ALP token protocol', 'Omni-style issue/send/mint/burn on-chain', 'done'),
    M('Token registry + balances', 'Deterministic indexer, reorg-safe', 'done'),
    M('Token explorer', 'Registry, holders, token pages on the site', 'done'),
    M('OP_RETURN projects layer', 'Embed project data on-chain', 'done'),
    M('Alpha Stablecoin', 'Fiat-backed asset issueable on ALP', 'todo'),
  ]},
  { name: 'Alpha Wallet & DeFi', items: [
    M('Alpha Wallet core', 'Keys, addresses, encryption — done', 'done'),
    M('Wallet GUI / web wallet', 'Browser wallet UI', 'wip'),
    M('Alpha Swap / DEX', 'Atomic swaps + AMM on ALP', 'todo'),
    M('Staking & validator rewards', 'PoS-style reward layer (future)', 'todo'),
    M('Lending & escrow', 'On-chain collateral + escrow contracts', 'todo'),
  ]},
  { name: 'Alpha Pay & Identity', items: [
    M('Payments', 'send/receive, payment links (base exists)', 'done'),
    M('Merchant API + QR pay', 'Invoice + QR payment flow', 'todo'),
    M('Remittance', 'Cross-border settlement rail', 'todo'),
    M('Alpha ID / DID', 'Self-sovereign identity + credentials', 'todo'),
    M('Alpha KYC', 'Reusable verification for businesses', 'todo'),
  ]},
  { name: 'Alpha Web3, AI & Enterprise', items: [
    M('NFT layer', 'Digital collectibles on ALP', 'todo'),
    M('Gaming & marketplace', 'Web3 economies + domains (vikas.alpha)', 'todo'),
    M('Alpha Oracle', 'External data feeds on-chain', 'todo'),
    M('AI agents + M2M pay', 'Autonomous transactions layer', 'todo'),
    M('Enterprise suite', 'Supply-chain, certificates, audit, registry', 'todo'),
  ]},
];

function render() {
  let done = 0, total = 0;
  const html = PHASES.map((p, pi) => {
    const d = p.items.filter(i => i.s === 'done').length;
    total += p.items.length; done += d;
    const pct = Math.round(d / p.items.length * 100);
    return `<div class="rm-section">
      <div class="rm-head"><div class="rm-num">${String(pi+1).padStart(2,'0')}</div>
        <h3>${p.name}</h3><div class="prog">${d}/${p.items.length}</div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${p.items.map(i => `
        <div class="milestone ${i.s}">
          <div class="dot">${i.s==='done'?'&#10003;':i.s==='wip'?'&#9679;':''}</div>
          <div><div class="mt">${i.t}</div><div class="md">${i.d}</div></div>
          <div class="tag-${i.s}">${i.s==='done'?'COMPLETE':i.s==='wip'?'IN PROGRESS':'PLANNED'}</div>
        </div>`).join('')}
    </div>`;
  }).join('');
  document.getElementById('roadmap').innerHTML = html +
    `<div class="detail"><h3>Overall progress: ${done}/${total} milestones complete</h3>
       <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div></div>`;
}
render();
</script>
</body></html>
