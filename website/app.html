<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>αMine — Alpha Miner</title>
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest-app.json">
<link rel="icon" href="coin.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e1a;color:#e8e8f0;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.card{background:#12172a;border:1px solid #ffffff14;border-radius:20px;padding:22px;margin-bottom:14px}
h1{font-size:24px;text-align:center}
.sub{text-align:center;color:#8a93b8;font-size:13px;margin:6px 0 18px}
button{width:100%;padding:16px;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}
.big{background:linear-gradient(135deg,#f7931a,#ff9f2e);color:#0a0e1a}
.ghost{background:#1c2340;color:#e8e8f0}
.gold{background:#f7c948;color:#0a0e1a}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff10;font-size:14px}
.stat b{color:#f7931a}
.warn{color:#ffb84d;font-size:12px;text-align:center;margin-top:8px}
.hid{display:none}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#0d1226;color:#e8e8f0;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>⛏ αMine</h1>
  <div class="sub">Real Proof-of-Work mining — rewards paid to your address</div>
  <input id="addr" placeholder="Your ALPHA address (alpha1… or 1…)">
  <div class="stat"><span>Hashrate</span><b id="hr">0 H/s</b></div>
  <div class="stat"><span>Nonces tried</span><b id="nt">0</b></div>
  <div class="stat"><span>Blocks found</span><b id="bf">0</b></div>
  <div class="stat"><span>Wallet balance</span><b id="bal">…</b></div>
  <button class="big" id="mineBtn" onclick="toggleMine()">▶ Start Mining</button>
  <button class="gold" id="installBtn" onclick="doInstall()">⬇ Install App</button>
  <div class="warn hid" id="installedMsg">✓ Installed — open from home screen</div>
  <div class="warn" id="gateMsg"></div>
</div>
<div class="card">
  <div class="stat"><span>🎁 Referral</span><b style="font-size:11px">bot → rewards</b></div>
  <button class="gold" onclick="copyRef()">Copy Referral Link</button>
  <button class="ghost" onclick="location.href='referral.html'">Earn & Rewards</button>
  <button class="ghost" onclick="location.href='wallet.html'">Open Wallet</button>
</div>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
const KEY='alpha_mine_last';
let mining=false,nonces=0,found=0,t0=0,work=null,addr='';
const thr=Math.min(4,navigator.hardwareConcurrency||2);
// prefill from HD wallet if present
try{const hd=JSON.parse(localStorage.getItem('alpha_hd')||'{}');if(hd.addrs&&hd.addrs[0])document.getElementById('addr').value=hd.addrs[0];}catch(e){}
function upd(){const dt=(Date.now()-t0)/1000||1;document.getElementById('hr').textContent=(nonces/dt/1000).toFixed(1)+' kH/s';
 document.getElementById('nt').textContent=nonces.toLocaleString();}
function hexToBytes(h){const b=new Uint8Array(h.length/2);for(let i=0;i<b.length;i++)b[i]=parseInt(h.substr(i*2,2),16);return b;}
function bytesToHex(b){return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');}
// server compares int.from_bytes(hash,"little") < target — reverse digest bytes first
function ltTarget(hashHex,tHex){
 const bytes=hexToBytes(hashHex).reverse();
 const h=BigInt('0x'+bytesToHex(bytes)),t=BigInt('0x'+tHex);
 return h<t;
}
async function getWork(){
 const r=await fetch('/api/minework?address='+encodeURIComponent(addr));
 const d=await r.json();
 if(d.error)throw new Error(d.error);
 work={id:d.workid,prefix:hexToBytes(d.data),target:d.target,height:d.height};
}
async function grind(){
 // worker: iterate nonces, sha256d(prefix+nonceLE)
 let n=nonces>>>0;
 const buf=new Uint8Array(80);
 buf.set(work.prefix,0);
 const dv=new DataView(buf.buffer);
 while(mining&&work){
  dv.setUint32(76,n,true); // nonce LE at offset 76
  const d1=await crypto.subtle.digest('SHA-256',buf);
  const d2=await crypto.subtle.digest('SHA-256',d1);
  const hx=bytesToHex(new Uint8Array(d2));
  nonces=n+1;n++;
  if(ltTarget(hx,work.target)){
   const r=await fetch('/api/submitwork?workid='+work.id+'&nonce='+(n-1));
   const res=await r.json();
   if(res.accepted){found++;document.getElementById('bf').textContent=found;
    alert('⛏ BLOCK FOUND! height '+res.height+' — reward incoming!');
    await getWork();n=0;}
   else{work=null;break;}
  }
  if((n&0x3ff)===0)upd();
 }
}
async function toggleMine(){
 const now=Date.now(),last=+localStorage.getItem(KEY)||0;
 if(mining){mining=false;document.getElementById('mineBtn').textContent='▶ Start Mining';return;}
 addr=document.getElementById('addr').value.trim();
 if(!addr){alert('Enter your ALPHA address first');return;}
 if(now-last<86400000){const h=Math.ceil((86400000-(now-last))/3600000);
  document.getElementById('gateMsg').textContent='⏳ Next mining window in ~'+h+'h — once per 24h';return;}
 localStorage.setItem(KEY,now);mining=true;t0=Date.now();nonces=0;found=0;
 document.getElementById('mineBtn').textContent='⏹ Stop Mining';
 document.getElementById('gateMsg').textContent='Mining on '+thr+' thread(s) — real PoW';
 try{await getWork();}catch(e){alert('Cannot get work: '+e.message);mining=false;return;}
 // spawn threads — each continues nonce space
 let base=0;const step=1;
 async function loop(){while(mining&&work){const n=base;base+=step;
  const buf=new Uint8Array(80);buf.set(work.prefix,0);const dv=new DataView(buf.buffer);
  for(let k=0;k<500;k++){dv.setUint32(76,n+k,true);
   const d1=await crypto.subtle.digest('SHA-256',buf);
   const d2=await crypto.subtle.digest('SHA-256',d1);
   const hx=bytesToHex(new Uint8Array(d2));nonces++;
   if(ltTarget(hx,work.target)){
    const r=await fetch('/api/submitwork?workid='+work.id+'&nonce='+(n+k));
    const res=await r.json();
    if(res.accepted){found++;document.getElementById('bf').textContent=found;
     alert('⛏ BLOCK FOUND height '+res.height);await getWork();return;}
    work=null;return;}
  }
  upd();}
 }
 for(let i=0;i<thr;i++)loop();
 setInterval(upd,1000);
}
function copyRef(){navigator.clipboard.writeText('https://t.me/alpha_blockchain_bot').then(()=>alert('Referral link copied'));}
// PWA install prompt — show Install button when browser offers it
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('installBtn').classList.remove('hid');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('installBtn').classList.add('hid');
  document.getElementById('installedMsg').classList.remove('hid');
  deferredPrompt=null;
});
async function doInstall(){
  if(deferredPrompt){deferredPrompt.prompt();
   const r=await deferredPrompt.userChoice;deferredPrompt=null;
   if(r.outcome==='accepted')document.getElementById('installBtn').classList.add('hid');
   return;}
  // no native prompt — show manual steps
  alert('Install manually:\n\nAndroid Chrome: ⋮ menu → "Add to Home screen"\niPhone Safari: Share → "Add to Home Screen"\nDesktop Chrome: install icon in address bar (right side)');
}
// if already installed (standalone), hide install button
if(window.matchMedia('(display-mode: standalone)').matches||navigator.standalone){
  document.getElementById('installBtn').classList.add('hid');
  document.getElementById('installedMsg').classList.remove('hid');
}
// balance
function loadBal(){const a=document.getElementById('addr').value.trim();if(!a)return;
 fetch('/api/address/'+encodeURIComponent(a)).then(r=>r.json()).then(d=>{document.getElementById('bal').textContent=(d.balance||0).toFixed(4)+' α'}).catch(()=>{});}
document.getElementById('addr').addEventListener('change',loadBal);loadBal();
</script>
</body></html>
