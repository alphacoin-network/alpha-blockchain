<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gold" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="40%" stop-color="#f7c948"/>
      <stop offset="75%" stop-color="#d9a520"/>
      <stop offset="100%" stop-color="#9a7014"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232344"/>
      <stop offset="100%" stop-color="#10101f"/>
    </linearGradient>
  </defs>

  <!-- coin body -->
  <circle cx="256" cy="256" r="244" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#7a5c10" stroke-width="8"/>
  <g stroke="#8a6a15" stroke-width="5" opacity="0.55">
    <path d="M256 12 v18 M256 482 v18 M12 256 h18 M482 256 h18"/>
    <path d="M82 82 l13 13 M417 417 l13 13 M430 82 l-13 13 M95 417 l-13 13"/>
  </g>

  <!-- dark face -->
  <circle cx="256" cy="256" r="206" fill="url(#face)"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#f7c948" stroke-width="5" stroke-dasharray="14 8" opacity="0.9"/>

  <!-- bold A mark -->
  <path d="M256 138 L338 348 L306 348 L256 218 L206 348 L174 348 Z" fill="url(#gold)" stroke="#7a5c10" stroke-width="4" stroke-linejoin="round"/>
  <rect x="226" y="300" width="60" height="16" rx="8" fill="url(#gold)" stroke="#7a5c10" stroke-width="3"/>

  <!-- dollar badge -->
  <circle cx="330" cy="330" r="34" fill="url(#gold)" stroke="#7a5c10" stroke-width="4"/>
  <text x="330" y="342" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="bold" fill="#10101f" text-anchor="middle">$</text>

  <!-- wordmark -->
  <text x="256" y="424" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" letter-spacing="12" fill="url(#gold)" text-anchor="middle" stroke="#7a5c10" stroke-width="1.5">AUSD</text>
</svg>
