<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gold" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="38%" stop-color="#f7c948"/>
      <stop offset="72%" stop-color="#d9a520"/>
      <stop offset="100%" stop-color="#8f6b12"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#26264a"/>
      <stop offset="100%" stop-color="#0e0e1e"/>
    </radialGradient>
  </defs>

  <!-- coin -->
  <circle cx="256" cy="256" r="246" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#6e530e" stroke-width="7"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#0e0e1e" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="214" fill="url(#face)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#f7c948" stroke-width="4" opacity="0.85"/>

  <!-- vector dollar sign: S-curve + vertical bar, perfectly centered -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M 288 178
             C 268 160, 232 160, 216 182
             C 203 199, 209 216, 228 223
             C 254 232, 282 242, 282 270
             C 282 302, 254 322, 220 314
             C 198 308, 187 290, 190 268"
          stroke-width="17"/>
    <path d="M 256 162 L 256 348" stroke-width="17"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="424" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-size="46"
        font-weight="800" letter-spacing="12" fill="#f7c948">AUSD</text>
  <text x="256" y="452" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-size="15"
        letter-spacing="6" fill="#7d7da0">ALPHA USD STABLE</text>
</svg>
